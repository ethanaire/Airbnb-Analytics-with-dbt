version: 2

models:
  - name: dim_host
    description: "Dimension table for Airbnb hosts."
    columns:
      - name: host_id
        description: "Unique identifier for each host."
        tests:
          - unique
          - not_null

      - name: host_name
        description: "Name of the host."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "length(host_name) >= 2"

      - name: is_superhost
        description: "Flag whether the host is a superhost (true/false)."
        tests:
          - not_null
          - accepted_values:
              values: ['true', 'false']

      - name: created_at
        description: "Record creation timestamp."
      - name: updated_at
        description: "Record last update timestamp."
